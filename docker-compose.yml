name: ${EMBY_PROJECT_NAME:?Defina EMBY_PROJECT_NAME}

x-logging: &logging
  driver: json-file
  options:
    max-size: 10m
    max-file: "3"

services:
  rclone:
    image: rclone/rclone:1.76.0
    restart: unless-stopped
    network_mode: host
    cap_add:
      - SYS_ADMIN
    security_opt:
      - apparmor:unconfined
    devices:
      - /dev/fuse:/dev/fuse
    stop_grace_period: 30s
    mem_limit: 512m
    logging: *logging
    volumes:
      - type: bind
        source: ${RCLONE_CONFIG_DIR:?Defina RCLONE_CONFIG_DIR}
        target: /config/rclone
        bind:
          create_host_path: false
      - ${EMBY_VOLUME_ROOT:?Defina EMBY_VOLUME_ROOT}/cache:/cache
      - type: bind
        source: ${EMBY_VOLUME_ROOT}/media
        target: /media
        bind:
          propagation: rshared
    command:
      - mount
      - ${RCLONE_REMOTE:?Defina RCLONE_REMOTE}
      - /media/drive
      - --config=/config/rclone/rclone.conf
      - --drive-root-folder-id=${RCLONE_DRIVE_ROOT_FOLDER_ID:?Defina o ID da pasta do Drive}
      - --read-only
      - --allow-other
      - --uid=${EMBY_UID:-1000}
      - --gid=${EMBY_GID:-1000}
      - --umask=022
      - --cache-dir=/cache
      - --vfs-cache-mode=full
      - --vfs-cache-max-size=${RCLONE_CACHE_MAX_SIZE:-8G}
      - --vfs-cache-max-age=1h
      - --vfs-cache-poll-interval=30s
      - --vfs-cache-min-free-space=15G
      - --buffer-size=16M
      - --vfs-read-ahead=32M
      - --vfs-read-chunk-size=16M
      - --vfs-read-chunk-size-limit=128M
      - --dir-cache-time=10m
      - --poll-interval=1m
      - --log-level=INFO
    healthcheck:
      test: ["CMD-SHELL", "grep -qs ' /media/drive ' /proc/mounts"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 20s

  emby:
    image: emby/embyserver:4.10.2.0
    restart: unless-stopped
    mem_limit: 2g
    logging: *logging
    depends_on:
      rclone:
        condition: service_healthy
    environment:
      UID: ${EMBY_UID:-1000}
      GID: ${EMBY_GID:-1000}
      GIDLIST: ${EMBY_GIDLIST:-1000}
      TZ: ${TZ:-America/Sao_Paulo}
    ports:
      - "127.0.0.1:${EMBY_LOOPBACK_PORT:?Defina EMBY_LOOPBACK_PORT}:8096"
    volumes:
      - ${EMBY_VOLUME_ROOT}/config:/config
      - type: bind
        source: ${EMBY_VOLUME_ROOT}/media
        target: /media
        read_only: true
        bind:
          propagation: rslave
    tmpfs:
      - /transcode:size=768m,uid=${EMBY_UID:-1000},gid=${EMBY_GID:-1000},mode=1770
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8096/emby/System/Info/Public"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 30s
    networks:
      proxy-network:
        aliases:
          - ${EMBY_PROXY_ALIAS:?Defina EMBY_PROXY_ALIAS}

  pages:
    image: nginx:1.30.8-alpine
    restart: unless-stopped
    mem_limit: 64m
    logging:
      driver: json-file
      options:
        max-size: 5m
        max-file: "2"
    volumes:
      - ./site:/usr/share/nginx/html:ro
    networks:
      proxy-network:
        aliases:
          - ${EMBY_PAGES_ALIAS:?Defina EMBY_PAGES_ALIAS}

networks:
  proxy-network:
    external: true
    name: proxy-network
