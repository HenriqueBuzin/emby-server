name: ${EMBY_PROJECT_NAME:?Defina EMBY_PROJECT_NAME}

x-logging: &logging
  driver: json-file
  options:
    max-size: 10m
    max-file: "3"

services:
  emby:
    image: emby/embyserver:4.10.2.0
    restart: unless-stopped
    mem_limit: 2g
    logging: *logging
    entrypoint:
      - /bin/sh
      - -ec
      - |
        until grep -qs ' /media/drive fuse.rclone ' /proc/mounts; do
          sleep 2
        done
        exec /init
    environment:
      UID: ${EMBY_UID:-1000}
      GID: ${EMBY_GID:-1000}
      GIDLIST: ${EMBY_GIDLIST:-1000}
      TZ: ${TZ:-America/Sao_Paulo}
    ports:
      - "127.0.0.1:${EMBY_LOOPBACK_PORT:?Defina EMBY_LOOPBACK_PORT}:8096"
    volumes:
      - ${EMBY_VOLUME_ROOT:?Defina EMBY_VOLUME_ROOT}/config:/config
      - type: bind
        source: ${EMBY_MEDIA_ROOT:-/srv/vps/shared-services/volumes/rclone/media}
        target: /media
        read_only: true
        bind:
          create_host_path: false
          propagation: rslave
    tmpfs:
      - /transcode:size=768m,uid=${EMBY_UID:-1000},gid=${EMBY_GID:-1000},mode=1770
    healthcheck:
      test: ["CMD-SHELL", "grep -qs ' /media/drive fuse.rclone ' /proc/mounts && wget -q -O /dev/null http://127.0.0.1:8096/emby/System/Info/Public"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 30s
    networks:
      proxy-network:
        aliases:
          - ${EMBY_PROXY_ALIAS:?Defina EMBY_PROXY_ALIAS}

  pages:
    image: nginx:1.30.8-alpine
    restart: unless-stopped
    mem_limit: 64m
    logging:
      driver: json-file
      options:
        max-size: 5m
        max-file: "2"
    volumes:
      - ./site:/usr/share/nginx/html:ro
    networks:
      proxy-network:
        aliases:
          - ${EMBY_PAGES_ALIAS:?Defina EMBY_PAGES_ALIAS}

networks:
  proxy-network:
    external: true
    name: proxy-network
